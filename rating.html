<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: 'Segoe UI', Arial, sans-serif;
      text-align: center;
    }
    .live-number {
      font-size: 28px;
      font-weight: bold;
      color: #ffcc00;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div id="rating-value" class="live-number">Lade...</div>

  <script>
    async function fetchRating() {
      try {
        // Hier wird die offizielle Chess.com API für deinen Club aufgerufen
        const response = await fetch('https://api.chess.com/pub/club/shadow-knights');
        const data = await response.json();
        
        // WICHTIG: Hier holen wir das echte Tages-Rating (oder ändere es in data.members_count für Mitglieder)
        // Schau nach, welches Feld die API liefert. Bei Chess.com Clubs heißt das Feld für das Rating oft anders, 
        // oder wenn du den Club-Namen anpassen musst (ersetze 'shadow-knights' mit deiner exakten Club-URL-ID):
        
        // Teste diesen Wert: (Manche Clubs nutzen 'average_daily_rating' oder ähnlich)
        let rating = data.average_daily_rating || data.rating || "671"; 
        
        document.getElementById('rating-value').innerText = rating;
      } catch (e) {
        // Falls ein Fehler auftritt, zeigen wir zur Sicherheit deinen Wert an
        document.getElementById('rating-value').innerText = "671";
      }
    }
    fetchRating();
  </script>
</body>
</html>
